name: CI

# Eski projede hiçbir iş akışı pull_request üzerinde çalışmıyordu; kurallar
# ancak main'e girdikten sonra denetleniyordu. Bu iş akışı PR'da da çalışır (S80-3).
# release.yml aynı kapıyı workflow_call ile çağırır; test adımları iki yerde yaşamaz (S80-8).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: mizan-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  APK_PATH: src/Mizan.App/bin/Release/net8.0-android/com.mizan.app-Signed.apk

jobs:
  build-and-test:
    name: Derle, test et, APK'yı doğrula
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET SDK (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Mizan.App net8.0-android hedefli: workload ve JDK olmadan çözümün restore'u düşer.
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore Mizan.sln

      # -warnaserror ikinci bir kemer: Directory.Build.props zaten açık,
      # ama birisi tek bir projede kapatırsa burada yakalanır.
      # Release derlemesi APK'yı da üretir (AndroidPackageFormat=apk); PR APK'sı debug imzalıdır.
      - name: Derle
        run: dotnet build Mizan.sln --configuration Release --no-restore -warnaserror

      # Takılan test işi 45 dakikalık zaman aşımına kadar sessizce bekletmesin: 5 dakikada düşer
      # ve takılan testin adını yazar. Döküm alınmaz; ad yeterli.
      - name: Test
        run: >
          dotnet test Mizan.sln
          --configuration Release
          --no-build
          --blame-hang-timeout 5m
          --blame-hang-dump-type none
          --logger "console;verbosity=minimal"
          --collect:"XPlat Code Coverage"
          --settings .runsettings
          --results-directory TestResults

      # F4, S80-4: Domain %95, Application %95, Presentation %90, Infrastructure %80.
      - name: Kapsam eşiklerini denetle
        shell: pwsh
        run: ./scripts/verify-coverage.ps1 -ResultsDirectory TestResults

      # K2a: kimlik, sürüm, ağ izni, allowBackup. Debug imzası burada kabul;
      # reddi yalnız release.yml'dedir (S80-3).
      - name: APK'yı doğrula
        shell: pwsh
        run: ./scripts/verify-apk.ps1 -Apk $env:APK_PATH

      - name: Kapsam raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore
          retention-days: 14
